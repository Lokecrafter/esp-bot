[env:sparkfun_esp32_iot_redboard]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = sparkfun_esp32_iot_redboard
framework = espidf, arduino

board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.flash_size = 4MB

lib_deps = 
    fastled/FastLED@^3.10.3
    garmin/LIDAR-Lite@^3.0.6
    esp32async/ESPAsyncWebServer@^3.9.3

build_flags = 
    -D CONFIG_FREERTOS_HZ=1000
    -D CONFIG_ESP_INSIGHTS_ENABLED=0